name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cbor2
      - run: python backend/test_repo_clean.py
      - run: python backend/test_security.py
      - run: python backend/test_basics.py
      - run: python backend/test_categorizer.py
      - run: python backend/test_parsers.py
      - name: JavaScript syntax
        run: |
          for f in static/*.js; do case "$f" in *apexcharts*) ;; *) node --check "$f";; esac; done
        shell: bash
