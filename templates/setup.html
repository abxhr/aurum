<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurum · Set a password</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="card">
  <div class="mark" style="background:none;padding:0"><img src="/static/icons/logo.svg" alt="" width="48" height="48" style="border-radius:12px;display:block"></div>
  <h1>Set your password</h1>
  <p class="sub">This PC only. Use 12 or more characters; a few random words is easy to remember and hard to guess. Your phone will use Face ID instead.</p>
  <input id="p1" type="password" placeholder="New password" autocomplete="new-password">
  <input id="p2" type="password" placeholder="Repeat it" autocomplete="new-password">
  <label class="lbl" for="ccy" style="display:block;text-align:left;margin:14px 0 4px;font-size:13px;opacity:.75">Your currency (all amounts are kept and shown in it; change later in Settings)</label>
  <select id="ccy"><option>AED</option><option>AUD</option><option>BRL</option><option>CAD</option><option>CHF</option><option>CNY</option><option>CZK</option><option>DKK</option><option>EUR</option><option>GBP</option><option>HKD</option><option>HUF</option><option>IDR</option><option>ILS</option><option>INR</option><option>JPY</option><option>KRW</option><option>MXN</option><option>MYR</option><option>NOK</option><option>NZD</option><option>PHP</option><option>PLN</option><option>SAR</option><option>SEK</option><option>SGD</option><option>THB</option><option>TRY</option><option>USD</option><option>ZAR</option></select>
  <button id="btn">Save and open</button>
  <div class="err" id="err" role="alert"></div>
</div>
<script src="/static/setup.js"></script>
</body>
</html>
